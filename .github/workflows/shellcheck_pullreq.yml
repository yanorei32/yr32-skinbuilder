name: reviewdog
on: [pull_request]
jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1.34.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
